<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2d63"><title>NIRC 마라톤 스케줄 빌더</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head><body>
<header class="top"><div><b>NIRC MARATHON SCHEDULE BUILDER</b><h1>마라톤 훈련 스케줄 제작기</h1></div><span class="ver">현재 버전 v1.1.2</span></header>
<main>
<section class="card"><h2>1. 대회 설정</h2><div class="grid"><label>대회 제목<input id="raceName" placeholder="예: 순천 남승룡마라톤"></label><label>대회 날짜<input id="raceDate" type="date"></label><label>성별<select id="sex"><option value="male">남자</option><option value="female">여자</option></select></label><label>현재 10K PB<input id="tenk" inputmode="numeric" placeholder="예: 4000 = 40:00"></label><label>목표 FULL (선택)<input id="goalFull" inputmode="numeric" placeholder="예: 25959 = 2:59:59"></label><label>스케줄 주수<select id="weeks"><option>8</option><option>10</option><option selected>12</option><option>14</option><option>16</option></select></label></div><button class="primary" id="calc">대회·훈련 기준 계산</button><button class="fixbtn" id="autoFix">마지막 3주 + RACE WEEK FIX 다시 적용</button><div class="fixnote">FIX: D-3 2000×3 → D-2 1600×3 → D-1 1000×4 → RACE WEEK JACK DANIELS / 장거리 BASE와 TAPER 분리</div><div id="metrics" class="metrics"></div></section>
<section class="card"><div class="row"><h2>2. 주차별 입력</h2><div><button id="prevW">◀</button><select id="weekSel"></select><button id="nextW">▶</button></div></div><div id="weekDates" class="sub"></div><div id="days"></div><label class="focus">주간 핵심 포인트<input id="focus" placeholder="예: 지구력 강화 / 마라톤 페이스 적응"></label><div class="actions"><button id="copyPrev">직전 주 구성 복사</button><button class="primary" id="saveWeek">이 주 저장</button></div></section>
<section class="card"><div class="row"><h2>3. 전체 스케줄</h2><div><button id="allView">전체</button><button id="monthView">월별</button></div></div><div id="schedule"></div><div class="actions"><button id="pngBtn">현재 월 PNG 저장</button><button id="xlsBtn">Excel(.xls) 저장</button><button id="printBtn">인쇄 / PDF</button></div></section>
</main><footer>데이터는 이 기기에 저장됩니다. 앱 업데이트 시 스케줄 데이터는 유지됩니다.</footer><script src="./app.js"></script></body></html>
